<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ACX Custody in two minutes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">
<style>
/* One dark stage in ACX navy: the film is the page; a quiet line of type above, a credit below. */
:root {
  --stage: #021F31; --navy: #003755; --sky: #AACDDC; --ink: #EAF3F7; --muted: #8FB0C0; --gold: #D4AF37;
  --sans: "Inter", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
body { background: var(--stage); color: var(--ink); font-family: var(--sans); }
main {
  max-width: 1120px; margin: 0 auto; display: grid; gap: 18px;
  padding-block: 32px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--sky); margin: 0; }
h1 { margin: 0; font-size: clamp(24px, 3.4vw, 36px); font-weight: 600; text-wrap: balance; }
.rule { width: 72px; height: 4px; background: var(--gold); }
.film { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden;
        box-shadow: 0 18px 50px rgba(0, 0, 0, .45); }
video { width: 100%; height: 100%; display: block; }
video:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; font-size: 13px; color: var(--muted); }
.foot p { margin: 0; min-width: 0; }
</style>
<main>
  <p class="eyebrow">AirCarbon Pte Ltd</p>
  <h1>ACX Custody in two minutes</h1>
  <div class="rule" aria-hidden="true"></div>
  <div class="film">
    <video id="film" controls playsinline preload="metadata" src="acx-custody-2min.mp4"
           aria-label="ACX Custody, a two-minute introduction with narration"></video>
  </div>
  <div class="foot">
    <p>Digital-asset custody for regulated exchanges and trading venues. 2 min 14 s, with narration.</p>
    <p>Voice by ElevenLabs</p>
  </div>
</main>

</html>
