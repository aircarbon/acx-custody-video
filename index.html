<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ACX Castrava</title>
<style>
/* The film fills the window and starts by itself. Browsers allow sound only after a click, so if sound is blocked it
   plays muted under one large "Click for sound" button; any click or key turns the sound on and starts it from the top. */
:root { --stage: #021F31; --gold: #D4AF37; --navy: #003755; --ink: #EAF3F7; --sky: #AACDDC; }
html, body { margin: 0; height: 100%; background: var(--stage); color: var(--ink);
  font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; }
.stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
video { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
#sound { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 18px;
  padding: 22px 34px; border: 0; border-radius: 999px; background: var(--gold); color: var(--navy); cursor: pointer;
  font: 600 clamp(20px, 2.6vw, 30px)/1 "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  box-shadow: 0 18px 50px rgba(0, 0, 0, .5); }
#sound svg { width: 1.3em; height: 1.3em; }
#sound:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
.credit { position: absolute; right: 14px; bottom: 10px; font-size: 12px; color: var(--sky); opacity: .7; }
</style>
</head>
<body>
<div class="stage">
  <video id="film" src="acx-custody-2min.mp4" playsinline preload="auto" autoplay controls
         aria-label="ACX Castrava, a two-minute introduction with narration"></video>
  <button id="sound" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
    Click for sound
  </button>
  <span class="credit">Voice by ElevenLabs</span>
</div>
<script>
const v = document.getElementById('film'), b = document.getElementById('sound');
function withSound() {
  b.hidden = true; v.muted = false; v.currentTime = 0;
  v.play().catch(() => {});
  ['click', 'keydown', 'touchstart'].forEach(e => document.removeEventListener(e, withSound));
}
v.muted = false;
v.play().then(() => { b.hidden = true; }).catch(() => {
  v.muted = true;
  v.play().catch(() => {});
  b.hidden = false;
  ['click', 'keydown', 'touchstart'].forEach(e => document.addEventListener(e, withSound, { once: true }));
});
</script>
</body>
</html>
